<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信タスクウィジェット</title>
<style>
  :root {
    --font-family: 'Zen Maru Gothic', sans-serif;
    --font-size: clamp(13px, 4.4vw, 28px);
    --text-color: #3a2f2a;
    --accent-color: #ff8a7a;
    --bg-color: 255, 250, 245;
    --bg-opacity: 0.72;
    --radius: clamp(10px, 3vw, 20px);
    --check-offset: 0px;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: var(--font-family);
    color: var(--text-color);
    -webkit-font-smoothing: antialiased;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #widget {
    display: inline-block;
    width: min(90vw, 480px);
    padding: clamp(12px, 4vw, 26px) clamp(14px, 4.5vw, 30px) clamp(10px, 3.5vw, 24px);
    border-radius: var(--radius);
    background: rgba(var(--bg-color), var(--bg-opacity));
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10);
    box-sizing: border-box;
  }

  #widget-title {
    font-size: calc(var(--font-size) * 0.78);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 10px 2px;
    color: var(--accent-color);
    opacity: 0.95;
  }

  ul#task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li.task {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: var(--font-size);
    line-height: 1.35;
  }

  .check {
    flex: 0 0 auto;
    width: 1.05em;
    height: 1.05em;
    margin: 0;
    transform: translateY(var(--check-offset));
    box-sizing: border-box;
    border-radius: 6px;
    border: 2px solid var(--accent-color);
    background: transparent;
    cursor: pointer;
    position: relative;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    font-size: inherit;
  }

  .check:checked { background: var(--accent-color); }

  .check:checked::after {
    content: "";
    position: absolute;
    left: 28%;
    top: 6%;
    width: 30%;
    height: 55%;
    border-right: 3px solid white;
    border-bottom: 3px solid white;
    transform: rotate(40deg);
  }

  .task-text {
    flex: 1 1 auto;
    word-break: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    opacity: 0.45;
  }

  .del-btn {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: var(--text-color);
    opacity: 0;
    cursor: pointer;
    font-size: calc(var(--font-size) * 0.8);
    line-height: 1;
    padding: 0 2px;
    transition: opacity 0.15s;
  }

  li.task:hover .del-btn { opacity: 0.45; }

  .del-btn:hover { opacity: 0.9 !important; }

  #edit-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.25;
    transition: opacity 0.15s;
    z-index: 100;
  }

  #edit-toggle:hover { opacity: 0.9; }

  #panel {
    position: fixed;
    top: 48px;
    right: 10px;
    width: 270px;
    max-height: 85vh;
    overflow-y: auto;
    background: #2b2622;
    color: #f4efe9;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    display: none;
    z-index: 99;
  }

  #panel.open { display: block; }

  #panel h3 {
    margin: 0 0 8px;
    font-size: 13px;
    opacity: 0.7;
    font-weight: 700;
  }

  #panel label {
    display: block;
    margin: 10px 0 4px;
    opacity: 0.85;
  }

  #panel input[type="text"], #panel input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #55493f;
    background: #1f1b18;
    color: #f4efe9;
    font-size: 13px;
  }

  #panel input[type="range"] { width: 100%; }

  #panel input[type="color"] {
    width: 100%;
    height: 28px;
    border: none;
    background: none;
    padding: 0;
  }

  #add-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  #add-row input { flex: 1; }

  #add-row button, .panel-btn {
    background: var(--accent-color);
    color: #2b2622;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }

  .row2 {
    display: flex;
    gap: 8px;
  }

  .row2 > div { flex: 1; }

  .note {
    opacity: 0.55;
    font-size: 11px;
    margin-top: 4px;
    line-height: 1.5;
  }

  hr {
    border: none;
    border-top: 1px solid #4a4038;
    margin: 12px 0;
  }

  /* mode=display のとき：編集UIを完全に隠す（配信画面用） */
  body.display-only #edit-toggle,
  body.display-only #panel {
    display: none !important;
  }
</style>
</head>
<body>

<button id="edit-toggle" title="編集パネル">⚙</button>

<div id="widget">
  <div id="widget-title">TODO</div>
  <ul id="task-list"></ul>
</div>

<div id="panel">
  <h3>タスクを追加</h3>
  <div id="add-row">
    <input type="text" id="new-task" placeholder="タスクを入力してEnter">
    <button onclick="addTask()">追加</button>
  </div>

  <hr>
  <button class="panel-btn" onclick="clearDone()">完了済みを削除</button>
</div>

<script>
const STORAGE_KEY = "obs_task_widget_v2";

let state = {
  title: "TODO",
  tasks: [
    { id: crypto.randomUUID(), text: "配信開始のあいさつ", done: false },
    { id: crypto.randomUUID(), text: "今日の目標を話す", done: false }
  ],
  font: "Zen Maru Gothic",
  fontSize: 20,
  textColor: "#3a2f2a",
  accent: "#ff8a7a",
  bgColor: "#fffaf5",
  bgOpacity: 72,
  checkOffset: 0
};

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = Object.assign(state, JSON.parse(raw));
    }
  } catch (e) {
    console.warn("load failed", e);
  }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn("save failed", e);
  }
}

// URLパラメータ・postMessage共通:「見た目」を上書きする（タスクは上書きしない）
function applyParams(p, isUrlSearchParams) {
  const get = (k) => isUrlSearchParams ? (p.has(k) ? p.get(k) : undefined) : p[k];

  if (get('title') !== undefined) state.title = get('title');
  if (get('font') !== undefined) state.font = get('font');
  if (get('size') !== undefined) state.fontSize = parseInt(get('size'), 10) || state.fontSize;
  if (get('color') !== undefined) state.textColor = '#' + String(get('color')).replace('#', '');
  if (get('accent') !== undefined) state.accent = '#' + String(get('accent')).replace('#', '');
  if (get('bg') !== undefined) state.bgColor = '#' + String(get('bg')).replace('#', '');
  if (get('opacity') !== undefined) state.bgOpacity = parseInt(get('opacity'), 10);
  if (get('checkOffset') !== undefined) state.checkOffset = parseInt(get('checkOffset'), 10) || 0;
}

function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  applyParams(p, true);

  // mode=display : OBSの「ブラウザソース」用。編集UIを隠す表示専用モード。
  // 何も指定しない場合は編集UIも出す「ドック/操作用」モード。
  if (p.get('mode') === 'display') {
    document.body.classList.add('display-only');
  }
}

// ジェネレーターのプレビューiframeからのリアルタイム更新(チラつき防止のためページ遷移せず反映する)
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'obs-widget-preview') {
    applyParams(e.data.params, false);
    applyStyles();
  }
});

// 同じURLを別ウィンドウ（カスタムブラウザドックなど）で開いている場合、
// そちらでタスクを操作したらこちら側にもリアルタイムで反映する
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) {
    loadLocal();
    renderTasks();
  }
});

function loadGoogleFont(name) {
  // Googleフォントに存在すれば読み込む。ローカルにしか無いフォント名なら404になるだけで無害。
  const id = 'gf-dynamic';
  let link = document.getElementById(id);
  if (!link) {
    link = document.createElement('link');
    link.id = id;
    link.rel = 'stylesheet';
    document.head.appendChild(link);
  }
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g, '+')}:wght@400;500;700&display=swap`;
}

function hexToRgbTriplet(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) {
    hex = hex.split('').map((c) => c + c).join('');
  }
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return `${r}, ${g}, ${b}`;
}

function applyStyles() {
  const root = document.documentElement.style;
  root.setProperty('--font-family', `'${state.font}', sans-serif`);
  root.setProperty('--text-color', state.textColor);
  root.setProperty('--accent-color', state.accent);
  root.setProperty('--bg-color', hexToRgbTriplet(state.bgColor));
  root.setProperty('--bg-opacity', (state.bgOpacity / 100).toString());
  root.setProperty('--check-offset', (state.checkOffset || 0) + 'px');
  document.getElementById('widget-title').textContent = state.title;
  loadGoogleFont(state.font);
}

function renderTasks() {
  const ul = document.getElementById('task-list');
  ul.innerHTML = '';

  state.tasks.forEach((t) => {
    const li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'check';
    cb.checked = t.done;
    cb.onchange = () => {
      t.done = cb.checked;
      saveLocal();
      renderTasks();
    };

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = t.text;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '×';
    del.onclick = () => {
      state.tasks = state.tasks.filter((x) => x.id !== t.id);
      saveLocal();
      renderTasks();
    };

    li.appendChild(cb);
    li.appendChild(span);
    li.appendChild(del);
    ul.appendChild(li);
  });
}

function addTask() {
  const input = document.getElementById('new-task');
  const text = input.value.trim();
  if (!text) return;

  state.tasks.push({ id: crypto.randomUUID(), text, done: false });
  input.value = '';
  saveLocal();
  renderTasks();
}

function clearDone() {
  state.tasks = state.tasks.filter((t) => !t.done);
  saveLocal();
  renderTasks();
}

document.getElementById('new-task').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});

document.getElementById('edit-toggle').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('open');
});
loadLocal();
applyUrlParams();
applyStyles();
renderTasks();
</script>
</body>
</html>
